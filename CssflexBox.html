<!DOCTYPE html>
<html>
<head>

    <title>Flexbox</title>

    <style>

        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 40px;
        }

        .card {
            width: 200px;
            padding: 30px;
            border: 1px solid #ccc;
            text-align: center;
            border-radius: 10px;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="card">
            <h2>Java</h2>
            <p>Backend Development</p>
        </div>

        <div class="card">
            <h2>Python</h2>
            <p>Programming</p>
        </div>

        <div class="card">
            <h2>JavaScript</h2>
            <p>Web Development</p>
        </div>

    </div>

</body>
</html>
